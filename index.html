<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section>
        <header>
          <i class="ri-menu-line"></i>
          <i class="ri-sun-fill"></i>
          <img src="./pokemon.png" alt="" />
        </header>
        <div class="search">
          <div class="searchbar">
            <input type="text" placeholder="search for pokemon" />
          </div>
          <div class="filter">
            <input type="text" placeholder="Filter By Types (1)" />
            <i class="ri-menu-fold-4-line"></i>
          </div>
        </div>
        <div class="boxes">
          <div class="box">
            <div class="text">
              <p>#0908</p>
              <i class="ri-heart-line"></i>
            </div>
            <img src="./houndoom-removebg-preview.png" alt="" />
            <div class="end">
              <div class="left">
                <h3>Houndoom</h3>
                <p>Dark/Fire</p>
              </div>
              <div class="right">
                <i class="ri-arrow-right-line"></i>
              </div>
            </div>
          </div>
          <div class="box">
            <div class="text">
              <p>#0908</p>
              <i class="ri-heart-line"></i>
            </div>
            <img src="./inkay-removebg-preview.png" alt="" />
            <div class="end">
              <div class="left">
                <h3>Inkay</h3>
                <p>Dark/Steel</p>
              </div>
              <div class="right">
                <i class="ri-arrow-right-line"></i>
              </div>

            </div>
            
          </div>
          <div class="box">
            <div class="text">
              <p>#0908</p>
              <i class="ri-heart-line"></i>
            </div>
            <img src="./meowscarada-removebg-preview.png" alt="" />
            <div class="end">
              <div class="left">
                <h3>Meowscarada</h3>
                <p>Grass</p>
              </div>
              <div class="right">
                <i class="ri-arrow-right-line"></i>
              </div>
            </div>
          </div>
          <div class="box">
            <div class="text">
              <p>#0908</p>
              <i class="ri-heart-line"></i>
            </div>
            <img src="./pawniard-removebg-preview.png" alt="" />
            <div class="end">
              <div class="left">
                <h3>Pawniard</h3>
                <p>Dark / Steel</p>
              </div>
              <div class="right">
                <i class="ri-arrow-right-line"></i>
              </div>
            </div>
          </div>
        </div>
        <footer>
          <div class="endbox">
            <div class="ending">
              <h3>Explore</h3>
              <p>Discover all Your <br> Favorite pokemon</p>
            </div>
            <div class="ending">
              <h3>Filter</h3>
              <p>Find Pokemon by <br> Types and abilities</p>
            </div>
            <div class="ending">
              <h3>Collection</h3>
              <p>Save and Manage <br> Your Collection</p>
            </div>
            <div class="ending">
              <h3>Stats</h3>
              <p>View Stats and learn <br> about Pokemon</p>
            </div>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
